[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking77-intent-classification"
version = "0.1.0"
description = "Reproducible TF-IDF baselines for BANKING77 intent classification"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
